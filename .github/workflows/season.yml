# Runs the season check weekly: every way this app can go stale, probed with
# self-repair attempted and instructions written, so nothing rots silently.
#
# THREE JOBS IN ONE RUN, and each is load-bearing:
#
#   the probes    `scripts/season/check.ts` asks after everything from feed
#                 fields to store deadlines, reading the live pages for the
#                 current values as it goes.
#   the commit    the report lands in `docs/season-report.md` on the default
#                 branch. That commit is also the repository activity that
#                 keeps GitHub from disabling every scheduled workflow here
#                 after 60 quiet days — including this one. `[skip ci]` keeps
#                 it from costing a deploy.
#   the issue     anything warn or fail is written into one standing issue
#                 (label `season`), updated in place rather than opened anew,
#                 so there is exactly one place to look and it is never a
#                 hundred duplicates deep.
#
# ONE-TIME SETUP: none required. Optional, each unlocking one probe:
#   - repository variable SEASON_SITE = the deployed app's address, if it is
#     not <owner>.github.io/<repo> — the locations probe checks the schedule
#     phones are actually served.
#   - repository variable VITE_EVENTS_MIRROR — the mirror probe starts
#     calling its /health.
#   - "Allow auto-merge" under Settings → General, which lets the exhibitors
#     refresh merge itself when its checks pass.

name: Season check

on:
  schedule:
    # Tuesday, after Monday's schedule refresh has run — so the locations
    # probe reads the schedule that refresh just published.
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: season
  cancel-in-progress: false

jobs:
  season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The osm-age probe dates tables by their last commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run every probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEASON_SITE: ${{ vars.SEASON_SITE }}
          VITE_EVENTS_MIRROR: ${{ vars.VITE_EVENTS_MIRROR }}
        run: npx tsx scripts/season/check.ts --json > /tmp/season.json

      - name: Commit the report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/season-report.md
          if git diff --cached --quiet; then
            echo 'The report is unchanged since last week.'
          else
            git commit -m 'Season report [skip ci]'
            git push
          fi

      - name: Open or update the season issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILS=$(jq -r '.counts.fail' /tmp/season.json)
          WARNS=$(jq -r '.counts.warn' /tmp/season.json)
          WEEK=$(jq -r '.week' /tmp/season.json)

          {
            echo "Weekly season check, ${WEEK}: **${FAILS} to fix, ${WARNS} to watch.**"
            echo
            jq -r '.attention' /tmp/season.json
            echo
            echo "The full table is in \`docs/season-report.md\` (https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/docs/season-report.md)."
            echo 'Each section above carries its own instructions; this issue is updated in'
            echo 'place every week and can be closed once everything reads ok.'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > /tmp/issue.md

          gh label create season --description 'The weekly season check' --color D93F0B 2>/dev/null || true
          OPEN=$(gh issue list --label season --state open --json number --jq '.[0].number // empty')

          if [ "$FAILS" = "0" ] && [ "$WARNS" = "0" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "This week's season check came back clean; closing."
            else
              echo 'Nothing needs attention and no issue is open.'
            fi
          elif [ -n "$OPEN" ]; then
            gh issue edit "$OPEN" --body-file /tmp/issue.md
            echo "Updated issue #$OPEN."
          else
            gh issue create --label season \
              --title 'Season check: attention needed' \
              --body-file /tmp/issue.md
          fi
