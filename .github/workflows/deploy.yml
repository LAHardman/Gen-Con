# Publishes the app to GitHub Pages, so it can be opened and installed on a
# phone without anyone running a dev server.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this runs itself.
#
# GitHub Pages only serves private repositories on a paid plan. On the free
# plan the repository has to be public for this to work — see README.md, which
# also lists the hosts that build a private repository for free.
#
# The schedule is imported here rather than committed, so the repository stays
# free of a large generated file and the published site refreshes on its own.

name: Check and deploy

on:
  # Any branch may be pushed. Everything is checked; only the default branch,
  # whatever it happens to be called in this repository, is then deployed.
  push:
  # Checks on pull requests, which is where they are worth most — and which
  # otherwise get no CI at all, since the deploy below skips them.
  pull_request:
  # Refresh the schedule without pushing anything.
  workflow_dispatch:
    inputs:
      request_delay:
        description: 'Milliseconds between requests to Gen Con'
        default: '150'
  # Weekly top-up. Cheap once the cache is warm: only events the cache has
  # never seen are fetched.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, and don't cancel one that is already publishing.
#
# Deploying runs share one group so two of them can never race. Check-only runs
# — pull requests, and pushes to any other branch — take a group per ref
# instead, so a pull request's checks neither queue behind a deploy nor hold
# one up.
concurrency:
  group: >-
    ${{ github.ref_name == github.event.repository.default_branch && 'pages'
    || format('checks-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Types and tests, on every push and every pull request. The deploy below
  # waits on this, so nothing reaches the published site without passing it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

  build:
    needs: check
    # Deploy on a dispatch, on the weekly schedule, and on a push to the default
    # branch. Never on a pull request: it is checked above, not published.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gen Con's own catalogue API: about 1,100 requests, roughly nine minutes,
      # no cache and no resume protocol because there is nothing to resume — it
      # either completes or it fails, and it refuses to write a short schedule.
      #
      # A failure here is not fatal. The app treats a missing schedule as a
      # normal state and still works as a map, and everybody who already has the
      # app keeps the copy they have: the worker only caches a response it can
      # see is good.
      - name: Import the schedule
        continue-on-error: true
        run: npm run fetch:events -- --delay ${{ inputs.request_delay || 150 }}

      # Push the snapshot to the mirror, if one is configured. Inert until the
      # EVENTS_MIRROR_URL variable and EVENTS_MIRROR_TOKEN secret are set, and
      # never fatal — a mirror that cannot be reached is not a reason to stop
      # publishing the app.
      - name: Send the schedule to the mirror
        if: vars.EVENTS_MIRROR_URL != ''
        continue-on-error: true
        run: |
          if [ ! -s public/events.json ]; then
            echo 'No schedule was imported this run; leaving the mirror as it is.'
            exit 0
          fi
          code=$(curl -sS -o /tmp/mirror.out -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ secrets.EVENTS_MIRROR_TOKEN }}" \
            -H 'Content-Type: application/json' \
            --data-binary @public/events.json \
            "${{ vars.EVENTS_MIRROR_URL }}")
          echo "mirror answered $code: $(cat /tmp/mirror.out)"
          [ "$code" = '200' ]

      - run: npm run build
        env:
          VITE_EVENTS_MIRROR: ${{ vars.EVENTS_MIRROR_URL }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
