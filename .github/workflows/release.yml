# Building the two store apps, so the release that should be rare is also
# cheap when it comes.
#
# WHY THIS EXISTS AT ALL, given the data pack means the apps update
# themselves: some things still need a release, and every one of them lands
# at a bad moment — Google raises the required target API level once a year
# and a stale app first goes invisible to new users, Apple deprecates a
# WebView API, a certificate expires. None of those are hard. What makes
# them expensive is re-learning provisioning eighteen months later, so the
# knowledge lives here instead of in somebody's memory. `season:check`
# watches the dates.
#
# RUN IT ONCE WITH `upload: false` FIRST. That builds both apps and hands
# them back as workflow artifacts without touching either store — the same
# habit as `fetch-rates.mjs --dry`, and for the same reason: the first real
# upload is the one that finds out whether the signing material is right,
# and finding that out without publishing anything is worth a run.
#
# WHAT IT NEEDS, as repository secrets. Nothing here is inert without them:
# the build jobs run and only the upload steps are skipped.
#
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key inside it
#   ANDROID_KEY_PASSWORD        that key's password
#   PLAY_SERVICE_ACCOUNT_JSON   a Play Console service account, for uploads
#   IOS_CERTIFICATE_BASE64      the distribution certificate (.p12)
#   IOS_CERTIFICATE_PASSWORD    its password
#   IOS_PROVISIONING_PROFILE    the App Store profile, base64-encoded
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
#                               an App Store Connect API key, for uploads
#
# THE KEYSTORE IS THE ONE UNRECOVERABLE SECRET. Apple certificates reissue
# in minutes and Play can reset an upload key, but an upload keystore that
# exists nowhere else ends that app's update path for ever. It belongs in
# these secrets *and* somewhere offline; `scripts/season/store-dates.json`
# carries the yearly reminder to check both are still there.

name: Release the apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.2.0'
        required: true
      upload:
        description: 'Send to TestFlight and the Play internal track'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same `dist/` both shells wrap, built once so the two apps can never
  # be built from different bundles.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      # The schedule is imported into the bundle so a first launch works
      # with no network — the one thing a store app can do that the website
      # cannot. A build that could not reach Gen Con still ships: the app
      # imports the catalogue itself on first run, which is the whole point
      # of the device importer.
      - name: Import the schedule
        continue-on-error: true
        run: npm run fetch:events

      - run: npm run build
        env:
          # Where installed copies look for data refreshes. Without it they
          # read the pack baked into the bundle and never see a newer one.
          VITE_PACK_HOST: ${{ vars.PACK_HOST }}

      # Say out loud what the apps will look for, because the alternative is
      # finding out from an installed copy that never refreshes. An unset or
      # mis-set PACK_HOST is not an error — the app falls back to the pack
      # baked into the bundle and simply never sees a newer one — which is
      # exactly the kind of quiet nothing that goes unnoticed for a year.
      - name: Say where the apps will look for their data
        run: |
          host='${{ vars.PACK_HOST }}'
          if [ -z "$host" ]; then
            echo "::warning::PACK_HOST is not set. These apps will read only the pack baked into the bundle and will never pick up a newer one. Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          echo "PACK_HOST = $host"
          case "$host" in
            */pack|*/pack/) ;;
            *) echo "::warning::PACK_HOST does not end in /pack. It names the directory holding manifest.json, not the site root, so the apps will fetch $host/manifest.json and find nothing." ;;
          esac
          if grep -rqF "$host" dist/assets/*.js; then
            echo "Confirmed: the pack host is compiled into the bundle."
          else
            echo "::error::PACK_HOST is set but is not in the built bundle. The build did not pick it up."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist
          retention-days: 5

  android:
    needs: web
    runs-on: ubuntu-latest
    # Enough to publish a release and attach the APK to it. The workflow's
    # own default is read-only; this is the one job that writes.
    permissions:
      contents: write
    # Asked here rather than in a step's `if:` — the `secrets` context is not
    # available there, so the condition would be silently false for ever.
    # `refresh.yml` carries the same note; it is an easy hour to lose.
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist

      - name: Put the bundle in the shell
        run: npx cap sync android

      - name: Set the version
        run: |
          # versionName is what people see; versionCode must rise on every
          # upload and never repeat, so it is the run number rather than
          # anything derived from the version string.
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Unlock the keystore
        if: env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > android/app/upload.keystore

      - name: Build the app bundle
        working-directory: android
        env:
          GENCON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GENCON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GENCON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # An installable APK, which the bundle above is not.
      #
      # An .aab is an upload format: Google splits it into per-device APKs at
      # download time, and a phone cannot open one. So a build nobody can try
      # is the default outcome of a release workflow, which is the wrong way
      # round while the app is still being looked at rather than shipped.
      #
      # Debug rather than release, because Android refuses to install an
      # unsigned APK and the debug build is signed with the throwaway key
      # every SDK generates. It is the same web bundle, the same pack and the
      # same native shell; what differs is that it is debuggable and not
      # minified. For putting the app on your own phone, that is the build.
      - name: Build an APK you can install
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Somewhere a phone can actually reach.
      #
      # A workflow artifact is a zip behind a login: to try the app you have
      # to be signed in to GitHub, download it on a computer, unzip it and
      # move the APK across. A release asset is a plain URL that a phone
      # opens directly, which is the whole difference between "there is a
      # build" and "I can try the build".
      #
      # TEST BUILDS SHARE ONE ROLLING TAG, and the asset keeps one filename,
      # so the download URL never changes. That is the point: a link — or a
      # QR code made from it once — always fetches the newest build, instead
      # of a new address to find every time. Store releases get their own
      # versioned tag, because those are meant to be distinguishable for ever.
      - name: Publish the APK where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD: ${{ inputs.upload }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          # One filename, so the URL is stable across builds.
          cp "$apk" gen-con-trip.apk

          if [ "$UPLOAD" = 'true' ]; then
            TAG="v${VERSION}"
            TITLE="Gen Con Trip ${VERSION}"
            FLAGS=''
          else
            TAG='test'
            TITLE='Gen Con Trip — latest test build'
            FLAGS='--prerelease'
          fi

          NOTES=$(cat <<NOTE
          **Version ${VERSION}, build ${GITHUB_RUN_NUMBER}** — from \`${GITHUB_SHA:0:8}\` on \`${GITHUB_REF_NAME}\`.

          ## Install it

          Open this page on the phone and tap **gen-con-trip.apk**. Android will
          ask you to allow installing from wherever you opened it — that is the
          ordinary sideload prompt. Play Protect will also warn that the
          developer is unrecognised: this build is signed with the debug key
          every Android SDK generates, not a registered one.

          ## What it is

          The same app as the website, wrapped in a native shell. The schedule
          and all fifteen data tables are inside the download, so it works with
          no network from the first launch — and it refreshes them from the
          published pack on its own after that, without needing a new build.

          A debug build: debuggable and unminified, otherwise identical.
          NOTE
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" $FLAGS
          fi
          # --clobber, because the rolling tag replaces its asset every build.
          gh release upload "$TAG" gen-con-trip.apk --clobber

          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gen-con-trip.apk"
          echo "### APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gen-con-trip.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Send to the Play internal track
        if: ${{ inputs.upload && env.HAVE_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gencontrip.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal

  ios:
    needs: web
    runs-on: macos-latest
    env:
      HAVE_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist

      # No `pod install`: Capacitor 8 wires its plugins through Swift Package
      # Manager (`ios/App/CapApp-SPM`), so there is no Podfile and no separate
      # .xcworkspace — xcodebuild resolves the packages itself against the
      # .xcodeproj.
      - name: Put the bundle in the shell
        run: npx cap sync ios

      # By sed rather than by `agvtool`, which wants the project to use Apple
      # Generic versioning — Capacitor's template sets no VERSIONING_SYSTEM at
      # all, so agvtool has nothing to edit. These two build settings are what
      # Info.plist actually interpolates, and editing them is the same move the
      # Android job makes on build.gradle.
      - name: Set the version
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${{ inputs.version }};/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -o 'MARKETING_VERSION = [^;]*;' ios/App/App.xcodeproj/project.pbxproj | head -1

      # Without signing material this still proves the project compiles,
      # which is most of what a first run is for.
      - name: Build unsigned
        if: ${{ !inputs.upload }}
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Archive and send to TestFlight
        if: ${{ inputs.upload }}
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE:-}" ]; then
            echo 'No iOS signing material configured; nothing to upload.'
            exit 0
          fi
          # A throwaway keychain, so nothing of this run outlives it.
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          echo "$CERTIFICATE" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build -exportOptionsPlist ../ExportOptions.plist

          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f build/App.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
