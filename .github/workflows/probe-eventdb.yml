name: Probe eventdb (temporary)
on:
  push:
    branches: [eventdb-import]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find rows the parser misses
        run: |
          curl -sS -m 60 -A "Gen-Con-trip-planner (personal project)" -o /tmp/h.html "https://gencon.eventdb.us/dayTime.php?StartDate=2026-07-29%2010:00:00"
          node --input-type=module -e "
          import fs from 'fs';
          import { parseHourPage } from './scripts/lib/eventdb.mjs';
          const t=fs.readFileSync('/tmp/h.html','utf8');
          const got=new Set(parseHourPage(t,'2026-07-29 10:00:00').map(e=>e.id));
          const all=[...t.matchAll(/GameCode=([A-Z0-9]+)'/g)].map(m=>m[1]);
          console.log('links',all.length,'parsed',got.size);
          const missed=all.filter(c=>!got.has(c));
          console.log('missed',missed.join(','));
          for (const c of missed.slice(0,4)) { const i=t.indexOf('GameCode='+c); console.log('---',c); console.log(t.slice(Math.max(0,i-300),i+500)); }
          "
