name: Probe eventdb (temporary)
on:
  push:
    branches: [eventdb-import]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:events:mirror
      - name: What was written
        run: |
          ls -la public/events.json
          node -e "
          const {expandFeed}=0; const f=JSON.parse(require('fs').readFileSync('public/events.json','utf8'));
          console.log('format',f.format,'count',f.count,'year',f.year,JSON.stringify(f.source));
          console.log('types',JSON.stringify(f.keys.type));
          console.log('first',f.columns.title.slice(0,3),f.keys.start.slice(0,2),f.keys.start.slice(-2));
          console.log('cost sample',f.columns.cost.slice(0,8),'tickets',f.columns.ticketsAvailable.slice(0,8));
          "
