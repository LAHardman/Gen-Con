# Hotel prices, gathered inside the free monthly allowances of four services.
#
# MONTHLY, AND ON THE FIRST — because the allowances reset on the first, and a
# run that starts the month is a run whose whole budget is available. Splitting
# it across the month would collect prices at four different moments and
# compare them as though they were one, which is worse data for the same money.
#
# ONE RUN CANNOT OVERSPEND: the ledger in `src/data/rate-store.json` is checked
# before every request, so a workflow that fires twice by accident does the
# second run with whatever the first left, which is usually nothing. That is
# also why the store is committed — it is the only memory this has.
#
# NO SECRETS ARE REQUIRED, AND WITHOUT ONE THIS COLLECTS NOTHING. A source with
# no key takes itself out, the run proceeds with the rest, and on a fork with no
# secrets at all it writes an unchanged file and opens no pull request — correct
# behaviour rather than a failure, but also not prices. Measured on a runner on
# 2026-08-14, there is no keyless way in:
#
#   xotelo  prices a hotel for free but will not hand out the index. Its
#           /api/search is 401 "RapidAPI only", /api/list refuses every
#           parameter, and there is no /api/locations. Without a TripAdvisor key
#           per hotel it cannot be asked anything. See scripts/resolve-hotel-keys.mjs.
#   apify   needs a token and an actor id you choose.
#   serpapi needs a key. Free tier, no card, 100 searches a month — and this app
#           wants about a dozen: one per town, then a page at a time through the
#           big ones, which is where all 236 hotels actually come from.
#
# ONE-TIME SETUP: the "Allow GitHub Actions to create and approve pull requests"
# tick that `refresh.yml` also needs, and SERPAPI_KEY in the repository's
# secrets. Then run this with `verify: serpapi` — one search, printed in full,
# nothing written — before trusting a month's run to it.

name: Refresh hotel prices

on:
  schedule:
    # 07:00 UTC on the 1st. Early in the month, and outside US business hours
    # so a free tier's shared capacity is not being competed for.
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Plan only — no requests, no writes'
        type: boolean
        default: false
      probe:
        description: 'Ask Xotelo what it returns and print it — no writes, no quota'
        type: boolean
        default: false
      verify:
        description: 'One real search against one source, printed in full — no writes'
        type: choice
        default: 'no'
        options: ['no', 'serpapi', 'xotelo', 'apify']

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two runs at once would each read the ledger before the other wrote it, and
  # both would think they had the whole month's allowance.
  group: hotel-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # One request, printed in full, nothing written. This is how a new key is
      # proved before a month's run depends on it: the adapters were written
      # from documentation and none of these hosts answers from the sandbox
      # this app is built in, so the first real answer is worth reading.
      - name: Verify one source
        if: ${{ inputs.verify != 'no' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
        run: node scripts/fetch-rates.mjs --verify=${{ inputs.verify }}

      # What the live service actually returns, printed. The sandbox this app is
      # written in cannot reach any of these hosts, so this is the only place
      # the request shapes can be checked against reality.
      - name: Probe
        if: ${{ inputs.probe == true && inputs.verify == 'no' }}
        run: node scripts/resolve-hotel-keys.mjs --probe

      - name: Show the plan
        if: ${{ inputs.probe != true && inputs.verify == 'no' }}
        run: node scripts/fetch-rates.mjs --dry

      # Before the prices, because a hotel with no TripAdvisor key is a hotel
      # the keyless source cannot ask about — and that was every one of them.
      - name: Resolve hotel keys
        if: ${{ inputs.dry != true && inputs.probe != true && inputs.verify == 'no' }}
        run: node scripts/resolve-hotel-keys.mjs

      - name: Gather
        if: ${{ inputs.dry != true && inputs.probe != true && inputs.verify == 'no' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
        run: node scripts/fetch-rates.mjs

      # The generated module has to compile and the gathering rules have to
      # still hold, or the pull request is one nobody can merge.
      - name: Check
        if: ${{ inputs.dry != true && inputs.probe != true && inputs.verify == 'no' }}
        run: npm run check

      # No auto-merge here, deliberately: the body above says "worth reading
      # rather than merging on sight", and it means it — which sources answered
      # and where the walk floor moved are judgement calls. The season check's
      # data-prs probe nags if this sits unread past a fortnight, which is the
      # safety net for it stalling silently.
      - name: Open a pull request
        if: ${{ inputs.dry != true && inputs.probe != true && inputs.verify == 'no' }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/hotel-rates
          title: 'Hotel prices for this month'
          commit-message: |
            Refresh hotel prices within the free monthly allowances

            Generated by scripts/fetch-rates.mjs. The store carries the ledger
            of what each service was asked for this month, so the next run
            cannot overspend what this one used.
          body: |
            Monthly price refresh, gathered inside the free tiers of SerpApi,
            Xotelo, Amadeus and Apify.

            Worth reading rather than merging on sight:

            - **which sources answered.** A source missing from every row was
              either unconfigured or down, and if that persists its free tier
              has probably changed.
            - **the walk floor**, at the top of `src/data/rates.ts`. It is the
              cap the drive ring was collected under, so if it has moved a long
              way, the drive-ring list will have changed shape with it.
            - **the ledger** in `rate-store.json`, which says what was spent.
          labels: automated
          delete-branch: true
